version: '3.8'

services:
  # Next.js Frontend
  frontend:
    build: 
      context: ./dashboard
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - nextgic-network

  # FastAPI Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://nextgic:nextgicpass@postgres:5432/nextgic
      - REDIS_URL=redis://redis:6379/0
      - AGENT_API_KEY=local_dev_key
      - JWT_SECRET=local_jwt_secret_change_in_production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./logs:/app/logs
    networks:
      - nextgic-network

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=nextgic
      - POSTGRES_PASSWORD=nextgicpass
      - POSTGRES_DB=nextgic
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextgic"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - nextgic-network

  # Redis for WebSockets/Celery
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - nextgic-network

volumes:
  postgres_data:
  redis_data:

networks:
  nextgic-network:
    driver: bridge
